name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP-CS-Fixer (dry-run)
        run: composer cs

      - name: PHPStan
        run: composer phpstan

      - name: PHPStan (tests)
        run: composer phpstan-tests

  tests-core:
    name: Tests (core)
    runs-on: ubuntu-latest
    env:
      TERM: xterm
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure PHPUnit
        run: cp phpunit.example.xml phpunit.xml

      - name: Run tests
        run: composer test:core

  tests-integration:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [sqlite, mariadb, mysql, postgres, redis, memcached, smtp]
        include:
          - suite: sqlite
            service: ""
          - suite: mariadb
            service: mariadb
          - suite: mysql
            service: mysql
          - suite: postgres
            service: postgres
          - suite: redis
            service: redis
          - suite: memcached
            service: memcached
          - suite: smtp
            service: mailpit
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, memcached
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure PHPUnit
        run: cp phpunit.example.xml phpunit.xml

      - name: Start service
        if: matrix.service != ''
        run: docker compose up -d ${{ matrix.service }}

      - name: Wait for service
        if: matrix.service != ''
        shell: bash
        run: |
          set -euo pipefail
          service="${{ matrix.service }}"

          if [[ "$service" == "memcached" ]]; then
            sleep 2
            exit 0
          fi

          container_id="$(docker compose ps -q "$service")"
          for _ in {1..60}; do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}running{{end}}' "$container_id")"
            if [[ "$status" == "healthy" || "$status" == "running" ]]; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs "$service"
          echo "Service $service did not become ready in time." >&2
          exit 1

      - name: Run tests
        run: composer test:${{ matrix.suite }}

      - name: Dump service logs (on failure)
        if: failure() && matrix.service != ''
        run: docker compose logs ${{ matrix.service }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs:
      - tests-core
      - tests-integration
    permissions:
      contents: read
      id-token: write
    env:
      TERM: xterm
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, memcached
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure PHPUnit
        run: cp phpunit.example.xml phpunit.xml

      - name: Start services
        run: docker compose up -d mysql mariadb postgres redis memcached mailpit

      - name: Wait for services
        shell: bash
        run: |
          set -euo pipefail

          for service in mysql mariadb postgres redis memcached mailpit; do
            if [[ "$service" == "memcached" ]]; then
              sleep 2
              continue
            fi

            container_id="$(docker compose ps -q "$service")"
            for _ in {1..60}; do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}running{{end}}' "$container_id")"
              if [[ "$status" == "healthy" || "$status" == "running" ]]; then
                break
              fi
              sleep 2
            done

            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}running{{end}}' "$container_id")"
            if [[ "$status" != "healthy" && "$status" != "running" ]]; then
              docker compose logs "$service"
              echo "Service $service did not become ready in time." >&2
              exit 1
            fi
          done

      - name: Run tests with coverage
        run: XDEBUG_MODE=coverage vendor/bin/phpunit --configuration phpunit.xml --coverage-clover coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage.xml
          name: total-php85

      - name: Dump service logs (on failure)
        if: failure()
        run: docker compose logs
